                type: string
                maxLength: 100
              description: Mutable resource version or immutable content hash as a quoted strong ETag.
            Set-Cookie:
              schema:
                type: string
                maxLength: 400
              description: __Host-vdt_session=<opaque>; Secure; HttpOnly; SameSite=Lax; Path=/ (no Domain).
                CSRF token separate, no credentials in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

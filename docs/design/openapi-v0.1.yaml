        < expiry; recheck before commit/content release.
      security: []
    parameters: []
  /api/v1/auth/session:
    post:
      operationId: login
      summary: login
      tags:
      - TUC-01
      description: Authenticate VDT only; rotate session ID, HttpOnly Secure SameSite=Lax host-only cookie
        __Host-vdt_session; no CRM credentials. Login rate limited. CSRF required, generic invalid credential
        response.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'

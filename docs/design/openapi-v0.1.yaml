            $ref: '#/components/schemas/Dependency'
          minItems: 0
          maxItems: 200
        reason: &id004
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - dependencies
      - reason
      description: Client echoes exact dependency IDs/versions read. Server derives full dependency set from
        referenced graph and rejects omission of mutable heads with 428 or changes with 409. Empty allowed
        only for root creation without existing mutable dependencies; never skip authorization/version checks
        because array is empty.

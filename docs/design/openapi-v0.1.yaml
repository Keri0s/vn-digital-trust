openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: VN Digital Trust API — step 05 design
  version: 0.1.0
  description: 'Single SME; no runtime implementation or lab execution. Normative semantics: api-contract-v0.1.md,
    storage-transactions-v0.1.md and frozen RM-01 v0.4-r3. Permissions in x-required-permissions: array is
    AND; pipe within one entry is OR. Every permission includes active scope/assignment/expiry. All request
    properties are closed unless explicitly stated.'
servers:
- url: /
  description: Same-origin HTTPS through reverse proxy/TLS and policy gate; deployment hostname TO_SET_BEFORE_LAB.
security:
- sessionCookie: []
tags:
- name: TUC-01
- name: TUC-02
- name: TUC-03
- name: TUC-04
- name: TUC-05
- name: TUC-06
- name: TUC-07
- name: TUC-08
paths:

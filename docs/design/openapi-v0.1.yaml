      summary: getCsrf
      tags:
      - TUC-01
      description: Set Secure host-only CSRF cookie and return token for same-origin login. No domain permissions
        or authenticated data. Only VDT same-origin browser accepted; cache-control no-store.
      parameters: []
      responses:
        '200':
          description: Success; committed atomically with audit. Creation returns Location. Mutable aggregates
            return strong ETag.
          headers:
            X-Request-ID:
              schema: &id001
                type: string
                format: uuid
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                maxLength: 100
              description: Mutable resource version or immutable content hash as a quoted strong ETag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

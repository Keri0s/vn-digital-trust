components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-vdt_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Unique per principal/method/path. Same canonical body/file hash replays original result
        after current authorization; different payload=409. Retained for operation lifetime; never reuse.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Strong ETag of mutable target/parent aggregate from GET. Missing=428, mismatch=412. Snapshot
        dependencies checked separately.
    CsrfToken:
      name: X-CSRFToken
      in: header
      required: true
      schema:
        type: string
        maxLength: 256
      description: Required for every unsafe cookie-authenticated operation, including login after GET /auth/csrf.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 1000
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AssessmentQuery:
      name: assessment_id
      in: query
      required: true
      schema: *id001
      description: Context for effective scoped evidence authorization/verification.
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
      description: Plain text search on safe authorized name/code fields; no expression/query execution.
    owner_id:
      name: owner_id
      in: query
      schema: *id001
    system_id:
      name: system_id
      in: query
      schema: *id001
    asset_id:
      name: asset_id
      in: query
      schema: *id001
    branch_id:
      name: branch_id
      in: query
      schema: *id001
    scenario_id:
      name: scenario_id
      in: query
      schema: *id001
    RiskLevel:
      name: risk_level
      in: query
      schema: &id061
        type: string
        enum:
        - LOW
        - MODERATE
        - HIGH
        - CRITICAL
    TreatmentStatus:
      name: treatment_status
      in: query
      schema:
        type: string
        enum:
        - OPEN
        - IN_PROGRESS
        - READY_FOR_RETEST
        - CANCELLED
        - CLOSED
    EvaluationStatus:
      name: status
      in: query
      schema: &id057
        type: string
        enum:
        - EVALUATED
        - NEEDS_REVIEW
  responses:
    Problem:
      description: Problem details; minimized for unauthorized targets. See api-contract-v0.1.md error table.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          schema: *id001
        Cache-Control:
          schema:
            const: no-store
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Included only for OPERATION_IN_PROGRESS, retryable rate limit or temporary unavailability;
            seconds to wait. Reuse same key/payload for transient precommit failure.
  schemas:
    Scope:
      type: object
      additionalProperties: false
      properties:
        organization_id: *id001
        branch_ids: &id002
          type: array
          items: *id001
          minItems: 0
          maxItems: 200
        system_ids: *id002
        asset_ids: *id002
        data_asset_ids: *id002
        scenario_ids: *id002
        assessment_ids: *id002
      required:
      - organization_id
      - branch_ids
      - system_ids
      - asset_ids
      - data_asset_ids
      - scenario_ids
      - assessment_ids
      description: 'All populated dimensions intersect; all IDs must be inside the single organization and
        authorized parent scope. Empty arrays do not grant access: effective scope is always intersected with
        active role/assignment grants. Reviewer requires exact active assigned assessment and linked evidence,
        even if other arrays are empty. A write_scope cannot widen its parent.'
      examples:
      - &id046
        organization_id: 00000000-0000-4000-8000-000000000001
        branch_ids:
        - 00000000-0000-4000-8000-000000000002
        system_ids:
        - 00000000-0000-4000-8000-000000000003
        asset_ids: []
        data_asset_ids: []
        scenario_ids: []
        assessment_ids:
        - 00000000-0000-4000-8000-000000000004
    Dependency:
      type: object
      additionalProperties: false
      properties:
        resource_type:
          type: string
          enum:
          - organization
          - user
          - role_assignment
          - scope
          - context
          - scenario
          - control_definition
          - control_implementation
          - evidence_item
          - evidence_revision
          - verification_decision
          - assessment
          - gap
          - task
          - authentication_profile
        id: *id001
        version: &id006
          type: integer
          minimum: 1
      required:
      - resource_type
      - id
      - version
    WriteContext:
      type: object
      additionalProperties: false
      properties:
        dependencies:
          type: array
